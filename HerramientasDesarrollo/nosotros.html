<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="icon" href="img/desarrollo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="barra-navegacion">
      <div class="nav-izquierda">
        <div class="contenedor-logo">
          <img src="img/LOGO CFBD.png" alt="Logo CFBD" />
        </div>
      </div>

      <div class="enlaces-nav">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos (AZOR)</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="#clientes">Clientes</a>
        <a href="#contacto">Contacto</a>
      </div>

      <div class="botones-nav">
        <a href="login.html" class="btn-ingresar">Iniciar sesión</a>
        <a href="login.html?registro=true" class="btn-registro">Registrarse</a>
      </div>
    </nav>

    <div id="inicio">
      <div
        id="carouselExampleInterval"
        class="carousel slide"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner">
          <div class="carousel-item active" data-bs-interval="10000">
            <img
              src="img/img2.jpeg"
              class="d-block w-100"
              alt="Instalaciones CFBD"
              height="500px"
            />
          </div>

          <div class="carousel-item" data-bs-interval="10000">
            <img
              src="img/img1.jpeg"
              class="d-block w-100"
              alt="Instalaciones CFBD"
              height="500px"
            />
          </div>

          <div class="carousel-item" data-bs-interval="10000">
            <img
              src="img/img3.jpeg"
              class="d-block w-100"
              alt="Instalaciones CFBD"
              height="500px"
            />
          </div>

          <div class="carousel-item" data-bs-interval="10000">
            <img
              src="img/img4.jpeg"
              class="d-block w-100"
              alt="Instalaciones CFBD"
              height="500px"
            />
          </div>
        </div>

        <div class="texto-carousel">
          <h1>Personas trabajando por personas</h1>
          <p>
            Somos una organizacion comprometida con generar un impacto positivo y
            sostenible
          </p>
        </div>

        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleInterval"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>

        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleInterval"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
